[project]
name = "rag-ai-act-rgpd"
version = "0.1.0"
description = "Assistant RAG et agent de pré-analyse de conformité AI Act / RGPD / CNIL, avec citations et évaluation chiffrée"
authors = [
    { name = "Njee" }
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographie française des textes officiels (apostrophe courbe, guillemets).
allowed-confusables = ["’", "«", "»"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
rag = "rag_ai_act_rgpd.cli:main"
