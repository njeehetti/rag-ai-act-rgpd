name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: La base démarre avec pgvector
        run: |
          docker compose up -d --wait db
          docker compose exec -T db psql -U rag -d rag -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -E '^0\.8\.'
